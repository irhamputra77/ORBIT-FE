# ORBIT is served by Next.js on port 3030. The public HTTPS layer (for
# example Tailscale Serve) can proxy to this Nginx listener on port 8080.
server {
    listen 127.0.0.1:8080;
    server_name _;

    # The frontend accepts up to six SVR PDFs of 100 MB each.
    client_max_body_size 650M;

    # Swagger is served by the backend and does not have a Next.js route.
    location = /api-docs {
        return 301 /api-docs/;
    }

    location ^~ /api-docs/ {
        proxy_pass http://127.0.0.1:3001;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Keep /api/* on Next.js. ORBIT uses Route Handlers as a BFF for secure
    # authentication cookies, validation, multipart uploads, and API proxying.
    location / {
        proxy_pass http://127.0.0.1:3030;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Preserve App Router streaming responses.
        proxy_buffering off;
    }
}
